<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#170e12"/><style>text{font:22px sans-serif;fill:#f6eee9}.small{font-size:16px;fill:#cbb8bc}.box{fill:#2a1a20;stroke:#d96d65;stroke-width:2}.wire{stroke:#f0c36a;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0c36a"/></marker></defs><text x="45" y="55" font-size="32">ChromaGuard prototype circuit / signal map</text><rect class="box" x="40" y="120" width="220" height="170" rx="8"/><text x="70" y="165">Sensor pod</text><text class="small" x="70" y="200">pH · TDS · turbidity</text><text class="small" x="70" y="230">TCS3200 colour</text><text class="small" x="70" y="260">flow pulse input</text><rect class="box" x="360" y="105" width="260" height="205" rx="8"/><text x="405" y="155">ESP32 DevKit</text><text class="small" x="405" y="195">ADC 34 / 35 / 32 / 33</text><text class="small" x="405" y="225">GPIO 27 flow · 14 bypass</text><text class="small" x="405" y="255">Wi-Fi / JSON telemetry</text><path class="wire" d="M260 205 H360"/><rect class="box" x="730" y="100" width="200" height="80" rx="8"/><text x="775" y="148">Normal outlet</text><rect class="box" x="730" y="250" width="200" height="80" rx="8"/><text x="780" y="298">12V valve</text><rect class="box" x="1020" y="250" width="140" height="80" rx="8"/><text x="1045" y="298">Holding tank</text><path class="wire" d="M620 160 H730"/><path class="wire" d="M620 255 H730"/><path class="wire" d="M930 290 H1020"/><rect class="box" x="360" y="400" width="260" height="115" rx="8"/><text x="410" y="450">Status outputs</text><text class="small" x="410" y="480">green · red · amber · buzzer</text><path class="wire" d="M490 310 V400"/><rect class="box" x="730" y="400" width="200" height="115" rx="8"/><text x="775" y="450">Dosing pump</text><text class="small" x="775" y="480">optional treatment</text><path class="wire" d="M620 470 H730"/><text class="small" x="45" y="600">Use independent fusing, flyback suppression, isolation, emergency stop and tank-level interlocks before any live installation.</text></svg>
